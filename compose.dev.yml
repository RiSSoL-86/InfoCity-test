services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: infocity_postgres_dev
    restart: unless-stopped
    env_file:
      - ./src/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: infocity_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: infocity-backend:dev
    container_name: infocity_backend_dev
    build:
      context: .
      dockerfile: etc/docker/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./src/.env
    command: uvicorn app:app --app-dir src --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations
      - ./data:/app/data
      - model_cache:/opt/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: infocity-backend:dev
    container_name: infocity_celery_worker_dev
    build:
      context: .
      dockerfile: etc/docker/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./src/.env
    command: celery --app services.celery:celery_app worker --loglevel INFO --concurrency 1
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - model_cache:/opt/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  model_cache:
