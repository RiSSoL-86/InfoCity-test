[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "asgiref>=3.12.1",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.139.0",
    "pgvector>=0.4.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.2.2",
    "sqlalchemy>=2.0.51",
    "torch>=2.10.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.21",
    "types-aiofiles>=25.1.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- RUFF (Linter & Formatter) ---
[tool.ruff]
line-length = 79
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "TC",  # flake8-type-checking
]
ignore = [
    "B008",   # FastAPI uses dependency calls in defaults.
    "TC003",  # Keep stdlib annotations importable for runtime introspection.
]

[tool.ruff.lint.extend-per-file-ignores]
"migrations/**.py" = ["E", "F", "I"]
"**/migrations/**.py" = ["E", "F", "I"]
"src/services/api/*/routes.py" = ["TC002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- MYPY (Type Checking) ---
[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
enable_error_code = ["explicit-override"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "*.migrations.*",
    "migrations.*",
    "*.tests.*",
    "services.*.tests.*",
    "services.*.conftest",
    "conftest",
]
ignore_errors = true

# --- PYTEST ---
[tool.pytest.ini_options]
addopts = "--strict-markers --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src"]

# --- COVERAGE ---
[tool.coverage.run]
omit = [
    "src/**/tests/*",
    "src/conftest.py",
]

[tool.coverage.report]
show_missing = true
